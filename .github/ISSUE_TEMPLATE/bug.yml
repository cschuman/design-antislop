name: Bug
description: slopcheck, the hook, or the skill behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a rule that fires on good work, use the False positive template
        instead. For a suspected vulnerability, see SECURITY.md and report it
        privately.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command, and the file or directory you pointed it at.
      render: shell
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 --version`.
      placeholder: Python 3.13.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.2 / Ubuntu 24.04 / Windows 11
