name: Rule proposal
description: Propose a new signature for the ruleset
labels: ["rule-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        The bar here is precision, not coverage. A proposal needs a
        counter-example as much as it needs examples; that is what sets the
        bound. See CONTRIBUTING.md for the full shape.
  - type: dropdown
    id: dimension
    attributes:
      label: Dimension
      options: [visual, ux, copy, code]
    validations:
      required: true
  - type: textarea
    id: pattern
    attributes:
      label: The pattern
      description: A regex or a literal string.
      render: text
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Two or three real examples
      description: >
        Instances in shipped work, with links where you can. Generated samples
        are not evidence; the point of the ruleset is that these patterns
        appear in the wild.
    validations:
      required: true
  - type: textarea
    id: counter
    attributes:
      label: A counter-example
      description: >
        Text or code that is close to the pattern and is NOT slop. Proposals
        without this get sent back for one.
      render: text
    validations:
      required: true
  - type: input
    id: fix
    attributes:
      label: The fix, in one sentence
      description: >
        Phrased as an instruction. A rule that cannot say what to do instead
        is not ready.
      placeholder: Replace with a concrete outcome and a number.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Proposed severity
      description: >
        high means "never ship this". medium means "almost always wrong".
        low means "worth a look".
      options: [low, medium, high]
    validations:
      required: true
